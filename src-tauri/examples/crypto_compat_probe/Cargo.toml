[package]
name = "noid-crypto-compat-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dev-dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
aes-gcm-legacy = { package = "aes-gcm", version = "=0.10.3" }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
argon2-legacy = { package = "argon2", version = "=0.5.3", features = ["std"] }
base64 = "=0.23.1"
base64-legacy = { package = "base64", version = "=0.22.1" }
dirs = "=7.0.0"
dirs-legacy = { package = "dirs", version = "=6.0.0" }
hkdf = "=0.13.0"
hkdf-legacy = { package = "hkdf", version = "=0.12.4" }
hmac = "=0.13.0"
hmac-legacy = { package = "hmac", version = "=0.12.1" }
sha2 = "=0.11.1"
sha2-legacy = { package = "sha2", version = "=0.10.9" }
rand = "=0.10.3"
zeroize = "=1.9.1"
