<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noid Messenger — Presentation (EN)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0b;color:#e8e8ec;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.slide{max-width:min(92vw,1280px);width:100%;}
.slide img{width:100%;height:auto;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;background:rgba(20,20,24,.9);padding:10px 22px;border-radius:30px;border:1px solid #26262e}
.nav button{background:#1c1c22;color:#e8e8ec;border:1px solid #3a3a44;padding:6px 18px;border-radius:16px;cursor:pointer;font-size:15px}
.nav button:hover{background:#8b5cf6;border-color:#8b5cf6}
.nav span{color:#9a9aa5;font-size:14px}
.hint{position:fixed;top:18px;right:22px;color:#5a5a64;font-size:12px}
@media(max-width:640px){.hint{display:none}}
</style>
</head>
<body>
<div class="hint">&larr; &rarr; / Space — navigate</div>
<div class="slide"><img id="s" src="slides/slide01_en.svg" alt="slide"></div>
<div class="nav">
<button onclick="go(-1)">&larr;</button>
<span id="c">1 / 10</span>
<button onclick="go(1)">&rarr;</button>
</div>
<script>
let i=1;const N=10,L="en";
function go(d){i=Math.min(N,Math.max(1,i+d));u()}
function u(){document.getElementById('s').src='slides/slide'+String(i).padStart(2,'0')+'_'+L+'.svg';document.getElementById('c').textContent=i+' / '+N}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){go(1);e.preventDefault()}
 if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1);e.preventDefault()}
 if(e.key==='Home'){i=1;u()} if(e.key==='End'){i=N;u()}
});
let tx=null;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX);
document.addEventListener('touchend',e=>{if(tx===null)return;let dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(dx<0?1:-1);tx=null});
</script>
</body>
</html>
