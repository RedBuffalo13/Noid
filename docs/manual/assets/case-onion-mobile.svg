<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#10b981"/></marker>
    <marker id="arrx" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ef4444"/></marker>
  </defs>
  <rect width="1100" height="600" fill="#0a0a0b" rx="16"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#e8e8ec">Case 1 — two phones on carrier NAT, onion path</text>
  <text x="40" y="76" font-size="14" fill="#9a9aa5">No public IP on either side — invite carries the /onion3/ endpoint, circuits do the rest.</text>

  <!-- blocked direct path -->
  <line x1="300" y1="180" x2="800" y2="180" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrx)"/>
  <text x="460" y="168" font-size="14" fill="#ef4444">direct dial ✕ CGNAT blocks</text>

  <!-- Phone A -->
  <rect x="80" y="110" width="220" height="150" rx="16" fill="#121216" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="160" y="124" width="60" height="10" rx="5" fill="#1e1e26"/>
  <text x="110" y="165" font-size="19" font-weight="700" fill="#e8e8ec">Phone A</text>
  <text x="110" y="192" font-size="13" fill="#9a9aa5">Android · LTE</text>
  <text x="110" y="214" font-size="13" fill="#9a9aa5">a3f9….onion</text>
  <rect x="110" y="226" width="160" height="24" rx="12" fill="#8b5cf6" opacity="0.18"/>
  <text x="122" y="243" font-size="12" fill="#8b5cf6">tor mode: additional</text>

  <!-- Phone B -->
  <rect x="800" y="110" width="220" height="150" rx="16" fill="#121216" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="880" y="124" width="60" height="10" rx="5" fill="#1e1e26"/>
  <text x="830" y="165" font-size="19" font-weight="700" fill="#e8e8ec">Phone B</text>
  <text x="830" y="192" font-size="13" fill="#9a9aa5">Android · LTE</text>
  <text x="830" y="214" font-size="13" fill="#9a9aa5">k7q2….onion</text>
  <rect x="830" y="226" width="160" height="24" rx="12" fill="#8b5cf6" opacity="0.18"/>
  <text x="842" y="243" font-size="12" fill="#8b5cf6">tor mode: additional</text>

  <!-- Tor cloud -->
  <ellipse cx="550" cy="420" rx="280" ry="120" fill="#121216" stroke="url(#acc)" stroke-width="3"/>
  <text x="440" y="368" font-size="20" font-weight="700" fill="#e8e8ec">Tor network — 3-hop circuits</text>
  <g fill="#10b981" opacity="0.9">
    <circle cx="420" cy="420" r="8"/><circle cx="520" cy="452" r="8"/><circle cx="640" cy="408" r="8"/>
  </g>
  <text x="395" y="400" font-size="11" fill="#9a9aa5">guard</text>
  <text x="498" y="432" font-size="11" fill="#9a9aa5">middle</text>
  <text x="620" y="388" font-size="11" fill="#9a9aa5">exit→HS</text>
  <text x="420" y="508" font-size="13" fill="#9a9aa5">ISP sees: «this device talks to Tor» — nothing else</text>

  <!-- onion paths -->
  <path d="M190 260 C 240 330, 330 370, 410 415" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M910 260 C 860 330, 760 370, 650 412" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- invite -->
  <rect x="330" y="290" width="440" height="42" rx="10" fill="#17171f" stroke="#3a3a44"/>
  <text x="348" y="317" font-size="14" fill="#e8e8ec">invite: noid:&lt;peerId&gt;@…/onion3/k7q2…:4020/p2p/&lt;id&gt;</text>

  <!-- badges -->
  <rect x="80" y="540" width="300" height="34" rx="17" fill="#10b981" opacity="0.15"/>
  <text x="96" y="562" font-size="13" fill="#10b981">IP never enters the protocol</text>
  <rect x="400" y="540" width="320" height="34" rx="17" fill="#8b5cf6" opacity="0.15"/>
  <text x="416" y="562" font-size="13" fill="#8b5cf6">X3DH + Double Ratchet on top</text>
  <rect x="740" y="540" width="290" height="34" rx="17" fill="#10b981" opacity="0.15"/>
  <text x="756" y="562" font-size="13" fill="#10b981">first bootstrap ~30–90 s</text>
</svg>
