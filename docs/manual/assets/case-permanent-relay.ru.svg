<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#10b981"/></marker>
  </defs>
  <rect width="1100" height="620" fill="#0a0a0b" rx="16"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#e8e8ec">Кейсы 2–3 — постоянный релей: VPS или домашний ПК</text>
  <text x="40" y="76" font-size="14" fill="#9a9aa5">Один всегда-онлайн процесс = bootstrap-сид + /p2p-circuit релей + офлайн-ящик + нода DHT.</text>

  <rect x="430" y="100" width="240" height="170" rx="14" fill="#121216" stroke="#10b981" stroke-width="2"/>
  <text x="455" y="136" font-size="20" font-weight="700" fill="#e8e8ec">Нода на VPS</text>
  <text x="455" y="164" font-size="13" fill="#9a9aa5">noid-linux-x86_64 · headless</text>
  <text x="455" y="188" font-size="13" fill="#9a9aa5">порты 4020/tcp+udp · 4021/tcp</text>
  <text x="455" y="212" font-size="13" fill="#9a9aa5">идентичность при 1-м запуске</text>
  <rect x="455" y="226" width="195" height="26" rx="13" fill="#10b981" opacity="0.18"/>
  <text x="467" y="244" font-size="12" fill="#10b981">публично достижим → auto-relay</text>

  <rect x="430" y="330" width="240" height="180" rx="14" fill="#121216" stroke="#10b981" stroke-width="2"/>
  <text x="455" y="366" font-size="20" font-weight="700" fill="#e8e8ec">Домашний ПК</text>
  <text x="455" y="394" font-size="13" fill="#9a9aa5">проброс портов на роутере</text>
  <text x="455" y="418" font-size="13" fill="#9a9aa5">4020/tcp+udp · 4021/tcp</text>
  <text x="455" y="442" font-size="13" fill="#9a9aa5">dynDNS-имя для друзей</text>
  <rect x="455" y="456" width="200" height="26" rx="13" fill="#8b5cf6" opacity="0.18"/>
  <text x="467" y="474" font-size="12" fill="#8b5cf6">AutoNAT определяет доступность</text>

  <text x="532" y="312" font-size="15" font-weight="700" fill="#6b6b75">— или —</text>

  <rect x="80" y="130" width="200" height="110" rx="14" fill="#121216" stroke="#8b5cf6" stroke-width="2"/>
  <text x="104" y="168" font-size="18" font-weight="700" fill="#e8e8ec">Телефон / ноутбук</text>
  <text x="104" y="194" font-size="13" fill="#9a9aa5">за NAT оператора</text>
  <text x="104" y="216" font-size="13" fill="#9a9aa5">исходящий → через релей</text>

  <rect x="80" y="380" width="200" height="110" rx="14" fill="#121216" stroke="#8b5cf6" stroke-width="2"/>
  <text x="104" y="418" font-size="18" font-weight="700" fill="#e8e8ec">Нода друга</text>
  <text x="104" y="444" font-size="13" fill="#9a9aa5">за домашним NAT</text>
  <text x="104" y="466" font-size="13" fill="#9a9aa5">офлайн → парковка в ящик</text>

  <rect x="820" y="180" width="220" height="110" rx="14" fill="#121216" stroke="#8b5cf6" stroke-width="2"/>
  <text x="844" y="218" font-size="18" font-weight="700" fill="#e8e8ec">Любой в мешe</text>
  <text x="844" y="244" font-size="13" fill="#9a9aa5">bootstrap_nodes.json</text>
  <text x="844" y="266" font-size="13" fill="#9a9aa5">или просто инвайт</text>

  <rect x="820" y="360" width="220" height="110" rx="14" fill="#121216" stroke="#8b5cf6" stroke-width="2"/>
  <text x="844" y="398" font-size="18" font-weight="700" fill="#e8e8ec">Kademlia DHT</text>
  <text x="844" y="424" font-size="13" fill="#9a9aa5">юзернеймы · prekey</text>
  <text x="844" y="446" font-size="13" fill="#9a9aa5">указатели ящиков</text>

  <line x1="280" y1="185" x2="430" y2="185" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="280" y1="435" x2="430" y2="435" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="670" y1="225" x2="820" y2="235" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="670" y1="415" x2="820" y2="415" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="80" y="550" width="340" height="34" rx="17" fill="#10b981" opacity="0.15"/>
  <text x="96" y="572" font-size="13" fill="#10b981">отдельный релей-демон не нужен</text>
  <rect x="440" y="550" width="330" height="34" rx="17" fill="#8b5cf6" opacity="0.15"/>
  <text x="456" y="572" font-size="13" fill="#8b5cf6">релей видит метаданные, не текст</text>
  <rect x="790" y="550" width="260" height="34" rx="17" fill="#10b981" opacity="0.15"/>
  <text x="806" y="572" font-size="13" fill="#10b981">конверты ящика зашифрованы</text>
</svg>
