<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#10b981"/></marker>
  </defs>
  <rect width="1100" height="620" fill="#0a0a0b" rx="16"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#e8e8ec">Cases 4–6 — private mesh · tor_only pair · LAN</text>
  <text x="40" y="76" font-size="14" fill="#9a9aa5">Every node can relay and host mailboxes — you choose who anchors the mesh.</text>

  <!-- private mesh -->
  <text x="80" y="118" font-size="17" font-weight="700" fill="#8b5cf6">4 · Friends-only private mesh</text>
  <circle cx="290" cy="330" r="170" fill="none" stroke="#3a3a44" stroke-width="2" stroke-dasharray="6 6"/>
  <g fill="#121216" stroke="#8b5cf6" stroke-width="2">
    <rect x="240" y="140" width="100" height="52" rx="12"/>
    <rect x="140" y="245" width="100" height="52" rx="12"/>
    <rect x="240" y="420" width="100" height="52" rx="12"/>
    <rect x="360" y="330" width="100" height="52" rx="12"/>
  </g>
  <g fill="#e8e8ec" font-size="12.5" font-weight="600">
    <text x="258" y="171">Anna</text><text x="158" y="276">Boris</text>
    <text x="256" y="451">Vera</text><text x="378" y="361">Gleb</text>
  </g>
  <rect x="240" y="140" width="100" height="52" rx="12" fill="none" stroke="#10b981" stroke-width="3"/>
  <rect x="360" y="330" width="100" height="52" rx="12" fill="none" stroke="#10b981" stroke-width="3"/>
  <text x="352" y="160" font-size="12" fill="#10b981">★ bootstrap</text>
  <text x="470" y="352" font-size="12" fill="#10b981">★ bootstrap</text>
  <text x="100" y="540" font-size="13" fill="#9a9aa5">2–3 stable nodes in bootstrap_nodes.json</text>
  <text x="100" y="564" font-size="13" fill="#9a9aa5">relayed_only → peers see only your relays</text>

  <!-- tor_only pair -->
  <text x="590" y="118" font-size="17" font-weight="700" fill="#10b981">5 · tor_only pair</text>
  <rect x="580" y="150" width="180" height="90" rx="14" fill="#121216" stroke="#10b981" stroke-width="2"/>
  <text x="606" y="186" font-size="16" font-weight="700" fill="#e8e8ec">Side A</text>
  <text x="606" y="212" font-size="12.5" fill="#9a9aa5">a3f9….onion only</text>
  <rect x="800" y="150" width="180" height="90" rx="14" fill="#121216" stroke="#10b981" stroke-width="2"/>
  <text x="826" y="186" font-size="16" font-weight="700" fill="#e8e8ec">Side B</text>
  <text x="826" y="212" font-size="12.5" fill="#9a9aa5">k7q2….onion only</text>
  <path d="M760 195 C 770 160, 790 160, 800 195" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>
  <ellipse cx="780" cy="300" rx="110" ry="36" fill="#17171f" stroke="url(#acc)" stroke-width="2"/>
  <text x="712" y="306" font-size="13" fill="#e8e8ec">Tor — 3 hops each way</text>
  <text x="612" y="378" font-size="13" fill="#10b981">no direct listeners · IP never in protocol</text>

  <!-- LAN -->
  <text x="590" y="436" font-size="17" font-weight="700" fill="#8b5cf6">6 · LAN / air-gapped</text>
  <rect x="580" y="456" width="420" height="130" rx="14" fill="#121216" stroke="#3a3a44" stroke-width="2"/>
  <text x="606" y="490" font-size="14" font-weight="600" fill="#e8e8ec">mDNS auto-discovery</text>
  <text x="606" y="516" font-size="13" fill="#9a9aa5">no internet · no bootstrap · no accounts</text>
  <text x="606" y="540" font-size="13" fill="#9a9aa5">office · building · isolated site network</text>
  <g fill="#10b981"><circle cx="940" cy="500" r="7"/><circle cx="962" cy="530" r="7"/><circle cx="918" cy="540" r="7"/></g>
</svg>
